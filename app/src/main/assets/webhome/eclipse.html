<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Eclipse · 光影首页</title>
  <script>

  </script>
  <style>
    /* ===== 全局重置 ===== */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { height:100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      background: #f0f0f0;
      color: #222;
      transition: background .3s, color .3s;
    }

    /* ===== 主题变量 ===== */
    :root {
      --app-bg: #ffffff;
      --top-bg-start: #000000;
      --top-bg-end: #ffffff;
      --text-primary: #222;
      --text-secondary: #33302c;
      --text-muted: #8a847d;
      --card-bg: #2a2a2a;
      --badge-bg: rgba(255,255,255,0.2);
      --badge-color: #222;
      --rating-color: #ffd93d;
      --search-bg: rgba(255,255,255,.25);
      --search-text: #fff;
      --search-placeholder: rgba(255,255,255,.85);
      --icon-btn-bg: rgba(255,255,255,.18);
      --cat-bg: rgba(255,255,255,.12);
      --cat-text: rgba(255,255,255,.9);
      --cat-active-bg: rgba(0,0,0,.25);
      --cat-active-text: #ffffff;
      --sheet-bg: rgba(255,255,255,0.5);
      --sheet-text: #222;
      --sheet-muted: #8a847d;
      --btn-primary-bg: #222;
      --btn-primary-text: #fff;
      --btn-ghost-bg: #f0f0f0;
      --btn-ghost-text: #222;
      --filter-chip-bg: rgba(255,255,255,.5);
      --filter-chip-border: #d4cbc4;
      --filter-chip-active-bg: #222;
      --filter-chip-active-text: #fff;
      --fab-bg: rgba(255, 255, 255, 0.5);
      --fab-border: rgba(0,0,0,0.12);
      --fab-icon-stroke: #1a1a1a;
      --banner-dot-bg: #d4cbc4;
      --banner-dot-active: #222;
      --tag-bg: #f0f0f0;
      --tag-color: #555;
      --desc-color: #55504b;
      --toast-bg: rgba(30,22,18,.92);
      --toast-color: #fff;
      --setting-border: #efeae5;
    }

    .app {
      max-width:480px; margin:0 auto; min-height:100vh;
      background: var(--app-bg);
      position:relative; box-shadow:0 0 24px rgba(0,0,0,.08); overflow:hidden;
      padding-top: max(32px, calc(env(safe-area-inset-top, 20px) + 12px));
      transition: background .3s, color .3s;
    }
    .top-bg {
      position:absolute; top:0; left:0; right:0; height:480px;
      background:linear-gradient(180deg, var(--top-bg-start) 0%, var(--top-bg-end) 100%);
      pointer-events:none;
      transition: background .3s;
    }
    .content { position:relative; }

    /* ===== 顶部搜索栏 ===== */
    .topbar {
      display:flex; align-items:center; gap:8px; padding:4px 12px 6px;
      position:relative; z-index:3; height:56px;
      background:transparent;
    }
    .source-pill {
      display:inline-flex; align-items:center; max-width:110px; height:32px; padding:0 10px;
      overflow:hidden; color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:16px;
      background:rgba(255,255,255,.15);
      font-size:11px; font-weight:600;
      text-overflow:ellipsis; white-space:nowrap; cursor:pointer; flex-shrink:0; letter-spacing:.3px;
    }
    .source-pill:before {
      display:inline-block; width:6px; height:6px; margin-right:6px; border-radius:50%;
      background:#45e6b1; content:""; box-shadow:0 0 8px #45e6b1; flex-shrink:0;
    }
    .search-form {
      flex:1; min-width:0; display:flex; align-items:center; gap:6px; height:36px; padding:0 14px;
      border-radius:999px; background: var(--search-bg); border:none;
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    }
    .search-form svg { width:18px; height:18px; stroke: var(--search-text); flex-shrink:0; }
    .search-form input {
      flex:1; min-width:0; border:none; outline:none; background:transparent;
      font-size:14px; color: var(--search-text); height:100%; font-weight:500;
    }
    .search-form input::placeholder { color: var(--search-placeholder); font-weight:400; }
    .icon-btn {
      width:36px; height:36px; flex-shrink:0; border:none; border-radius:50%;
      background: var(--icon-btn-bg); color: var(--search-text); cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:0;
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      transition: background .2s, color .2s;
    }
    .icon-btn svg { width:20px; height:20px; display:block; stroke-width:2.2; stroke: currentColor; }

    /* ===== 分类导航 ===== */
    .cats-wrapper {
      position:relative; z-index:2; display:flex; align-items:center;
      padding:4px 8px 10px 12px;
      background:transparent;
    }
    .cats-wrapper .cats-scroll {
      display:flex; gap:4px; overflow-x:auto; padding:4px 0 2px;
      scrollbar-width:none; flex:1; margin-left:0;
    }
    .cats-wrapper .cats-scroll::-webkit-scrollbar { display:none; }
    .cat {
      flex-shrink:0; border:none; cursor:pointer; display:flex; align-items:center; gap:4px;
      font-size:14px; font-weight:600; color: var(--cat-text);
      background: var(--cat-bg); padding:6px 14px; border-radius:999px;
      white-space:nowrap; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
      transition:background .2s, transform .15s, color .2s; letter-spacing:.3px;
      text-shadow:0 1px 2px rgba(0,0,0,.08);
    }
    .cat svg { width:16px; height:16px; flex-shrink:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.1)); }
    .cat:active { transform:scale(.94); }
    .cat.active {
      background: var(--cat-active-bg);
      color: var(--cat-active-text);
      font-weight:700;
      box-shadow: 0 0 0 1px rgba(255,255,255,.3), 0 1px 6px rgba(0,0,0,.08);
    }

    /* ===== Banner ===== */
    .banner-wrap { padding:6px 0 4px; position:relative; z-index:1; overflow:hidden; }
    .banner-container {
      position:relative; width:calc(100% - 32px); margin:0 16px;
      aspect-ratio:16 / 9.6; overflow:hidden; border-radius:12px;
      box-shadow:0 6px 24px rgba(0,0,0,.18);
    }
    .banner-track {
      display:flex; transition:transform 0.5s ease; height:100%; will-change:transform;
    }
    .banner-item {
      flex:0 0 100%; height:100%; position:relative; cursor:pointer;
      border:none; background: var(--card-bg); overflow:hidden;
    }
    .banner-item .ph {
      position:absolute; inset:0; width:100%; height:100%; display:block;
    }
    .banner-item .ph-img {
      width:100%; height:100%; object-fit:cover; display:block;
    }
    .banner-item .ph-grad {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:1; color:rgba(255,255,255,.92); font-size:20px; font-weight:800;
      text-shadow:0 2px 8px rgba(0,0,0,.35); padding:0 12px; text-align:center;
      pointer-events:none; background:rgba(0,0,0,.2);
    }
    .banner-item .card-meta {
      position:absolute; left:0; right:0; bottom:0;
      padding:40px 16px 16px; background:linear-gradient(180deg,transparent,rgba(0,0,0,.78));
      z-index:3; color:#fff;
    }
    .banner-item .card-meta .rating {
      font-size:18px; font-weight:700; color: var(--rating-color); display:block; margin-bottom:2px;
      text-shadow:0 1px 6px rgba(0,0,0,.4);
    }
    .banner-item .card-meta .title {
      font-size:18px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      text-shadow:0 1px 6px rgba(0,0,0,.4);
    }
    .banner-item .card-meta .sub {
      font-size:13px; opacity:.85; margin-top:2px; display:block;
      text-shadow:0 1px 4px rgba(0,0,0,.4);
    }
    .banner-dots {
      display:flex; justify-content:center; gap:8px; padding:10px 0 4px;
    }
    .banner-dot {
      width:8px; height:8px; border-radius:50%; background: var(--banner-dot-bg);
      transition:all 0.3s; cursor:pointer; border:none; padding:0;
    }
    .banner-dot.active { background: var(--banner-dot-active); width:20px; border-radius:4px; }

    /* ===== 内容网格 ===== */
    .grid {
      display:grid; grid-template-columns:repeat(3,1fr); gap:14px 12px;
      padding:8px 16px 0;
    }
    .grid .card {
      border:none; background:none; padding:0; cursor:pointer;
      text-align:left; display:block; min-width:0; max-width:100%; transition:transform .15s;
    }
    .grid .card:active { transform:scale(.96); }
    .grid .card .poster {
      position:relative; width:100%; aspect-ratio:2/3; border-radius:10px;
      overflow:hidden; background: var(--card-bg); display:block; box-shadow:0 4px 14px rgba(0,0,0,.12);
    }
    .grid .card .ph {
      position:absolute; inset:0; width:100%; height:100%; display:block; background: var(--card-bg);
    }
    .grid .card .ph-img {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:2;
    }
    .grid .card .ph-grad {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:1; color:rgba(255,255,255,.92); font-size:14px; font-weight:700;
      text-shadow:0 2px 8px rgba(0,0,0,.35); padding:0 6px; text-align:center; pointer-events:none;
    }
    .grid .card .badge {
      position:absolute; left:0; right:0; bottom:0; padding:24px 6px 6px;
      color:#fff; font-size:11px; font-weight:600;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.68));
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:3;
    }
    .grid .card .name {
      margin-top:6px; font-size:13px; color: var(--text-secondary); font-weight:500;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      transition: color .3s;
    }
    .grid .card .card-rating {
      font-size:12px; color: var(--text-muted); font-weight:700; margin-top:2px; display:block;
      transition: color .3s;
    }

    /* ===== 筛选器 ===== */
    .filters-wrap { display:none !important; }

    /* ===== 自动翻页 ===== */
    .auto-page {
      display:none; min-height:42px; margin:5px auto 15px;
      color: var(--text-muted); font-size:12px; line-height:42px; text-align:center;
    }
    .auto-page.show { display:block; }
    .auto-page.loading { color: var(--text-muted); }

    .page-foot {
      padding:20px 0 30px; text-align:center; color: var(--text-muted); font-size:12px;
      transition: color .3s;
    }
    .empty { padding:40px 20px; text-align:center; color: var(--text-muted); font-size:14px; grid-column:1/-1; }
    .empty b { display:block; font-size:16px; color: var(--text-secondary); margin-bottom:6px; }

    /* ===== 弹窗 ===== */
    .sheet-mask {
      position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }
    .sheet-mask.open { opacity:1; pointer-events:auto; }
    .sheet {
      position:fixed; left:50%; transform:translate(-50%,100%); bottom:0;
      width:100%; max-width:480px; max-height:82vh; overflow-y:auto;
      background: var(--sheet-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      border-radius:18px 18px 0 0; z-index:41;
      transition:transform .28s ease, background .3s; padding:18px 18px 28px;
      color: var(--sheet-text);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .sheet.open { transform:translate(-50%,0); }
    .sheet-bar { width:36px; height:4px; border-radius:2px; background: var(--text-muted); margin:0 auto 14px; }
    .detail-head { display:flex; gap:14px; }
    .detail-poster {
      width:108px; aspect-ratio:3/4; border-radius:10px; overflow:hidden;
      position:relative; flex-shrink:0; background: var(--card-bg);
    }
    .detail-poster .ph { position:absolute; inset:0; width:100%; height:100%; display:block; background: var(--card-bg); }
    .detail-poster .ph-grad {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:1; color:rgba(255,255,255,.85); font-size:16px; font-weight:700;
      text-shadow:0 2px 8px rgba(0,0,0,.35); padding:0 8px; text-align:center; pointer-events:none;
      transition:opacity .3s;
    }
    .detail-poster .ph-grad.hide { opacity:0; }
    .detail-poster .ph-img {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; z-index:2;
    }
    .detail-info h2 { font-size:20px; margin:2px 0 8px; color: var(--sheet-text); }
    .detail-info .meta { font-size:13px; color: var(--sheet-muted); margin-bottom:6px; }
    .detail-info .badge-line { font-size:13px; color: var(--sheet-text); font-weight:700; margin-bottom:10px; }
    .tag-row { display:flex; gap:8px; flex-wrap:wrap; }
    .tag {
      font-size:12px; color: var(--tag-color); background: var(--tag-bg);
      border-radius:999px; padding:3px 10px;
      transition: background .3s, color .3s;
    }
    .detail-desc { margin-top:14px; font-size:14px; line-height:1.7; color: var(--desc-color); }
    .detail-actions { display:flex; gap:12px; margin-top:18px; }
    .btn {
      flex:1; height:44px; border-radius:999px; border:none; cursor:pointer;
      font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px;
      transition: background .3s, color .3s;
    }
    .btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-text); }
    .btn.ghost { background: var(--btn-ghost-bg); color: var(--btn-ghost-text); }
    .btn.danger-ghost { background:#f6e3e0; color:#b3402e; }
    .btn svg { width:18px; height:18px; }

    .setting-row {
      display:flex; justify-content:space-between; gap:12px;
      padding:12px 2px; border-bottom:1px solid var(--setting-border);
      font-size:14px;
      color: var(--sheet-text);
      transition: border-color .3s, color .3s;
    }
    .setting-row .k { color: var(--sheet-muted); flex-shrink:0; }
    .setting-row .v { color: var(--sheet-text); text-align:right; word-break:break-all; }

    /* ===== Toast ===== */
    .toast {
      position:fixed; left:50%; top:18%; transform:translateX(-50%);
      background: var(--toast-bg); color: var(--toast-color); font-size:14px;
      border-radius:999px; padding:10px 20px; z-index:80;
      opacity:0; pointer-events:none; transition:opacity .25s, background .3s, color .3s;
      max-width:80%; text-align:center; font-weight:500; box-shadow:0 8px 30px rgba(0,0,0,.3);
    }
    .toast.show { opacity:1; }

    /* ===== 悬浮筛选按钮 ===== */
    .filter-fab {
      position:fixed; bottom:32px; right:20px; z-index:50;
      width:56px; height:56px; border-radius:50%;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform .25s ease, background .25s, border-color .25s;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
    }
    .filter-fab:active { transform:scale(.92); }
    .filter-fab svg {
      width:28px; height:28px;
      stroke: var(--fab-icon-stroke);
      stroke-width:2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));
      transition: stroke .3s;
    }

    /* ===== 筛选面板（修复：移除嵌套 backdrop-filter 与合成提示属性，保证文字正常渲染） ===== */
    .filter-panel {
      position:fixed; bottom:100px; right:20px; z-index:51;
      width:calc(100% - 40px); max-width:340px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius:16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow:0 8px 32px rgba(0,0,0,.15);
      padding:16px 18px;
      display:none;
      max-height:65vh;
      overflow-y:auto;
      color: #1a1a1a;
      transition: background .3s, color .3s;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .filter-panel.open { display:block; }
    .filter-panel .filter-row {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      align-items:center;
      padding:6px 0;
      border-bottom:1px solid rgba(0,0,0,.08);
    }
    .filter-panel .filter-row:last-child { border-bottom:none; }
    .filter-panel .filter-label {
      flex:0 0 100%;
      font-size:13px;
      font-weight:600;
      color: #1a1a1a;
      margin-bottom:2px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.3);
    }
    .filter-panel .filter-chip {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 30px;
      padding: 4px 14px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.3);
      font-size: 12px;
      font-weight: 500;
      color: #1a1a1a !important;
      cursor: pointer;
      transition: all .2s;
      flex-shrink: 0;
      white-space: nowrap;
      line-height: 1.4;
      text-shadow: 0 1px 2px rgba(255,255,255,0.2);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      user-select: none;
    }
    .filter-panel .filter-chip span {
      display: inline-block;
      vertical-align: middle;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #1a1a1a !important;
    }
    .filter-panel .filter-chip:active { transform:scale(.94); }
    .filter-panel .filter-chip.active {
      background: var(--filter-chip-active-bg);
      color: var(--filter-chip-active-text) !important;
      border-color: var(--filter-chip-active-bg);
      text-shadow: none;
    }
    .filter-panel .filter-chip.active span {
      color: var(--filter-chip-active-text) !important;
    }

    @media (max-width:420px) {
      .filter-fab { width:48px; height:48px; bottom:24px; right:14px; }
      .filter-fab svg { width:24px; height:24px; }
      .filter-panel { max-width:280px; right:14px; bottom:80px; padding:14px; }
    }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

    /* ===== 主题切换按钮（调色盘） ===== */
    .theme-toggle {
      width:36px; height:36px; flex-shrink:0; border:none; border-radius:50%;
      background: var(--icon-btn-bg); color: var(--search-text); cursor:pointer;
      display:flex; align-items:center; justify-content:center; padding:0;
      backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      transition: background .2s, color .2s;
    }
    .theme-toggle svg {
      width:20px; height:20px; stroke: currentColor; stroke-width:2.2;
      fill:none; stroke-linecap:round; stroke-linejoin:round;
    }

    /* ===== 调色面板（透明80%背景，全宽延伸） ===== */
    .palette-mask {
      position:fixed; inset:0;
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index:100;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .palette-mask.open { opacity:1; pointer-events:auto; }
    .palette-panel {
      background: rgba(255, 255, 255, 0.2);
      border-radius:20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      width: calc(100% - 40px);
      max-width:400px;
      max-height:75vh;
      display:flex;
      flex-direction:column;
      box-shadow:0 12px 48px rgba(0,0,0,.15);
      transform:scale(.95);
      transition:transform .25s ease;
      color:#222;
      overflow:hidden;
      padding:0; /* 无内边距，子元素全宽 */
    }
    .palette-mask.open .palette-panel { transform:scale(1); }

    /* 标题区域：透明80% + 全宽 + 粘性定位 */
    .palette-header {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      padding: 16px 20px;

<script>

  function buildColorGrid(container, currentColor, onChange) {
    container.innerHTML = '';

      swatch.className = 'color-swatch' + (color === currentColor ? ' active' : '');
      swatch.style.background = color;
      swatch.dataset.color = color;
      swatch.addEventListener('click', function() {
        container.querySelectorAll('.color-swatch').forEach(function(el) {
          el.classList.remove('active');

        swatch.classList.add('active');
        onChange(color);
      });
      container.appendChild(swatch);

  function updateStartColor(color) {
    currentStart = color;
    startHex.value = color.toUpperCase();

      el.classList.toggle('active', el.dataset.color === color);

    document.documentElement.style.setProperty('--app-bg', end);
    if (save) {
      try {
        localStorage.setItem('eclipse_custom_gradient', JSON.stringify({ start: start, end: end }));

    startHex.value = start.toUpperCase();

    startPreview.style.background = start;
    endPreview.style.background = end;

    currentEnd = end;
    startColorGrid.querySelectorAll('.color-swatch').forEach(function(el) {
      el.classList.toggle('active', el.dataset.color === start);
    });

      var color = hexFromInput(this);
      if (color) updateStartColor(color);

    endHex.addEventListener('input', function() {

    '破晓之刃', '暗影重生', '极速狂飙', '冰封王座', '烈火战歌', '深海迷踪',
    '幻境之门', '星尘传说', '永恒之塔', '命运之轮', '黄昏要塞', '黎明之前',

      '<text x="28" y="404" fill="white" font-family="Arial,sans-serif" font-size="27" font-weight="bold">'+safe.slice(0,9)+'</text>'+
      '<text x="29" y="435" fill="white" fill-opacity=".68" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">ECLIPSE SELECT</text></svg>';
    return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
  }

  function getRating(index) {
    var base = 6.8 + ((index*13+7)%23)*0.1;
    if (base>9.2) base=9.2;
    return base.toFixed(1);
  }

  function generateAllItems() {
    var items = [];
    var typeNames = ['电影','剧集','综艺','动漫','纪录片'];
    var total = sampleTitles.length;
    for (var i=0; i<total; i++) {
      var typeIdx = i % typeNames.length;
      var year = 2020 + (i % 7);
      items.push({
        index: i,
        kind: 'vod',
        vodId: 'demo-'+(i+1),
        siteKey: '',
        name: sampleTitles[i],
        pic: posterData(sampleTitles[i], i),
        remarks: year+' · '+(['4K','HD','杜比','HDR'][i%4]),
        year: String(year),
        typeName: typeNames[typeIdx],
        area: ['内地','韩国','日本','美国','英国','法国'][i%6],
        style: { type:'rect', ratio:0.714 },
        rating: getRating(i)
      });
    }
    return items;
  }

  function fallbackHome() {
    var all = generateAllItems();
    return {
      version:1,
      source:{ key:'', name:'Eclipse 浏览器演示', type:0 },
      client:{ isLeanback:false, isLandscape:w.innerWidth>w.innerHeight, suggestedColumns:3 },
      classes:[
        { typeId:'movie', typeName:'电影', filter:true },
        { typeId:'series', typeName:'剧集', filter:false },
        { typeId:'variety', typeName:'综艺', filter:false },
        { typeId:'anime', typeName:'动漫', filter:false },
        { typeId:'documentary', typeName:'纪录片', filter:false }
      ],
      filters: {
        movie: [
          { key:'year', name:'年份', init:'', values:[{ name:'全部', value:'', selected:true }, { name:'2026', value:'2026' }, { name:'2025', value:'2025' }] },
          { key:'area', name:'地区', init:'', values:[{ name:'全部', value:'', selected:true }, { name:'深空', value:'space' }, { name:'地球', value:'earth' }] }
        ]
      },
      items: all,
      capabilities:{ category:true, filters:true, recommend:true }
    };
  }

  function status(message, busy) {
    state.loading = !!busy;
    setText('statusText', message || '');
    var app = byId('appRoot');
    if (app) {
      app.setAttribute('aria-busy', busy ? 'true' : 'false');
      if (busy) app.classList.add('loading'); else app.classList.remove('loading');
    }
    updateAutoPage();
  }

  function updateAutoPage() {
    var pager = byId('autoPage');
    if (!pager) return;
    pager.className = 'auto-page' + (state.hasMore ? ' show' : '') + (state.loading ? ' loading' : '');
    pager.textContent = state.hasMore ? (state.loading ? '正在加载…' : '滚动加载更多') : '';
  }

  function resolvePic(item, index) {
    var url = text(item && item.pic);
    if (!url) return posterData(item && item.name ? item.name : 'Eclipse', index || 0);
    if (url.indexOf('data:')===0) return url;
    if (state.native && w.fm && typeof w.fm.res === 'function') {
      try { return w.fm.res(url, {}); } catch(ignore) { return url; }
    }
    return url;
  }

  // ===== Banner 轮播 =====
  var bannerState = { index: 0, timer: null, items: [], initialized: false };

  function initBanner() {
    var track = byId('bannerTrack');
    var dots = byId('bannerDots');
    if (!track || !dots) return;
    clear(track); clear(dots);

    var list = state.homeItems || [];
    if (!list.length) {
      track.innerHTML = '<div class="banner-item" style="display:flex;align-items:center;justify-content:center;color:var(--text-muted);">暂无推荐</div>';
      bannerState.items = [];
      bannerState.initialized = true;
      return;
    }
    var bannerItems = list.slice(0, 5);
    bannerState.items = bannerItems;

    function stopAutoPlay() {
      if (bannerState.timer) { w.clearInterval(bannerState.timer); bannerState.timer = null; }
    }
    function startAutoPlay() {
      stopAutoPlay();
      if (bannerItems.length < 2) return;
      bannerState.timer = w.setInterval(function() {
        goTo((bannerState.index + 1) % bannerItems.length);
      }, 4000);
    }
    function goTo(index) {
      if (index < 0) index = bannerItems.length - 1;
      if (index >= bannerItems.length) index = 0;
      bannerState.index = index;
      var width = track.parentElement.clientWidth || 300;
      track.style.transform = 'translateX(-' + (index * width) + 'px)';
      var dotList = dots.querySelectorAll('.banner-dot');
      dotList.forEach(function(dot, i) { dot.classList.toggle('active', i === index); });
    }

    var fragment = d.createDocumentFragment();
    bannerItems.forEach(function(item, idx) {
      var div = d.createElement('div');
      div.className = 'banner-item';
      div.dataset.index = idx;
      var ph = d.createElement('span');
      ph.className = 'ph';
      var grad = d.createElement('span');
      grad.className = 'ph-grad';
      grad.textContent = item.name || '';
      var img = d.createElement('img');
      img.className = 'ph-img';
      img.alt = item.name || '';
      img.loading = 'lazy';
      img.src = resolvePic(item, idx);
      img.onerror = function(){ this.style.display='none'; };
      img.onload = function(){ this.style.display='block'; };
      ph.appendChild(grad); ph.appendChild(img);
      var meta = d.createElement('div');
      meta.className = 'card-meta';
      var rating = item.rating || getRating(item.index || idx);
      meta.innerHTML = '<span class="rating">'+rating+'</span><span class="title">'+text(item.name)+'</span>'+
        (item.year ? '<span class="sub">'+text(item.year)+' · '+text(item.typeName||'')+'</span>' : '');
      div.appendChild(ph); div.appendChild(meta);
      listen(div, 'click', function(){ openItem(item); });
      fragment.appendChild(div);
    });
    track.appendChild(fragment);

    var dotFragment = d.createDocumentFragment();
    for (var i=0; i<bannerItems.length; i++) {
      var dot = d.createElement('button');
      dot.className = 'banner-dot' + (i===0 ? ' active' : '');
      dot.dataset.index = i;
      listen(dot, 'click', function(e){
        var idx = parseInt(e.target.dataset.index);
        goTo(idx);
        stopAutoPlay();
        startAutoPlay();
      });
      dotFragment.appendChild(dot);
    }
    dots.appendChild(dotFragment);

    var container = byId('bannerContainer');
    if (container) {
      var resizeTimer;
      var resizeHandler = function() {
        w.clearTimeout(resizeTimer);
        resizeTimer = w.setTimeout(function(){ goTo(bannerState.index); }, 200);
      };
      w.addEventListener('resize', resizeHandler);
      container._resizeHandler = resizeHandler;
    }

    goTo(0);
    startAutoPlay();
    bannerState.initialized = true;
    w.__bannerStop = stopAutoPlay;
    w.__bannerStart = startAutoPlay;
  }

  function updateBannerVisibility() {
    var wrap = byId('bannerWrap');
    if (!wrap) return;
    if (state.active === '__home__') {
      wrap.style.display = '';
      bannerState.initialized = false;
      if (state.homeItems.length) {
        initBanner();
      }
    } else {
      wrap.style.display = 'none';
      if (bannerState.timer) {
        w.clearInterval(bannerState.timer);
        bannerState.timer = null;
      }
    }
  }

  // ===== 渲染卡片 =====
  function renderItems(append) {
    var host = byId('contentGrid');
    if (!host) return;
    if (!append) clear(host);

    if (!state.items.length && !append) {
      var empty = d.createElement('div');
      empty.className = 'empty';
      empty.textContent = '这个分类暂时没有内容';
      host.appendChild(empty);
      return;
    }

    var start = append ? host.children.length : 0;
    for (var i = start; i < state.items.length; i++) {
      (function(item, index) {
        var card = d.createElement('button');
        card.className = 'card';
        card.type = 'button';
        card.setAttribute('data-focus', focusId('card-' + state.active, index));
        card.setAttribute('data-card-index', String(index));
        card.setAttribute('aria-label', '打开 ' + text(item.name));
        card.addEventListener('click', function(){ openItem(item); });

        var poster = d.createElement('span');
        poster.className = 'poster';
        var ph = d.createElement('span');
        ph.className = 'ph';
        var grad = d.createElement('span');
        grad.className = 'ph-grad';
        grad.textContent = item.name || '未命名';
        var img = d.createElement('img');
        img.className = 'ph-img';
        img.alt = item.name || '';
        img.loading = 'lazy';
        img.src = resolvePic(item, index);
        img.onerror = function(){ this.style.display='none'; };
        img.onload = function(){ this.style.display='block'; };
        ph.appendChild(grad); ph.appendChild(img);

        var badgeText = item.remarks || item.year || item.typeName || '';
        if (badgeText) {
          var badge = d.createElement('span');
          badge.className = 'badge';
          badge.textContent = text(badgeText);
          ph.appendChild(badge);
        }
        poster.appendChild(ph);
        card.appendChild(poster);

        var name = d.createElement('div');
        name.className = 'name';
        name.textContent = item.name || '未命名';
        card.appendChild(name);

        var ratingEl = d.createElement('span');
        ratingEl.className = 'card-rating';
        ratingEl.textContent = item.rating || getRating(item.index || 0);
        card.appendChild(ratingEl);

        host.appendChild(card);
      }(state.items[i], i));
    }
    updateAutoPage();
    setText('contentHint', state.activeName + ' · 第 ' + state.page + ' 页');
    restoreFocus();
    if (!append) scheduleAutoPageCheck();
  }

  // ===== 筛选器渲染（强制文字用 span + 颜色） =====
  function renderFilters() {
    var host = byId('filters');
    var panelHost = byId('filterPanelContent');
    if (!panelHost) return;
    clear(panelHost);

    var values = state.active === '__home__' ? [] : asArray(state.filters[state.active]);
    if (!values.length) {
      var emptyMsg = d.createElement('div');
      emptyMsg.textContent = '当前分类无筛选条件';
      emptyMsg.style.color = 'var(--text-muted)';
      emptyMsg.style.textAlign = 'center';
      emptyMsg.style.padding = '12px 0';
      emptyMsg.style.fontSize = '13px';
      panelHost.appendChild(emptyMsg);
      return;
    }

    values.forEach(function(filter) {
      var row = d.createElement('div');
      row.className = 'filter-row';

      var label = d.createElement('div');
      label.className = 'filter-label';
      label.textContent = filter.name || filter.key;

      var choices = d.createElement('div');
      choices.style.display = 'flex';
      choices.style.flexWrap = 'wrap';
      choices.style.gap = '6px';

      var list = asArray(filter.values);
      list.forEach(function(choice) {
        var value = text(choice.value);
        var selected = text(state.extend[filter.key]) === value || (typeof state.extend[filter.key] === 'undefined' && !!choice.selected);
        var button = d.createElement('button');
        button.type = 'button';
        button.className = 'filter-chip' + (selected ? ' active' : '');
        // 强制用 span 包裹文字，并设置颜色
        var span = d.createElement('span');
        span.textContent = choice.name || value || '全部';
        span.style.color = '#1a1a1a';
        span.style.display = 'inline-block';
        span.style.verticalAlign = 'middle';
        button.appendChild(span);
        button.setAttribute('data-filter', filter.key);
        button.setAttribute('data-filter-value', value);
        if (selected) {
          span.style.color = '#ffffff';
        }
        listen(button, 'click', function() {
          state.extend[filter.key] = value;
          renderFilters();
          loadCategory(state.active, 1, false);
          closeFilterPanel();
        });
        choices.appendChild(button);
      });

      row.appendChild(label);
      row.appendChild(choices);
      panelHost.appendChild(row);
    });
  }

  // ===== 悬浮按钮 =====
  function toggleFilterPanel() {
    var panel = byId('filterPanel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      renderFilters();
    }
  }
  function closeFilterPanel() {
    byId('filterPanel').classList.remove('open');
  }

  // ===== 分页相关 =====
  function gridPreloadCount() {
    var host = byId('contentGrid');
    var cards = host ? host.getElementsByClassName('card') : [];
    if (!cards.length) return 1;
    var hostRect = host.getBoundingClientRect();
    var cardRect = cards[0].getBoundingClientRect();
    if (!hostRect.width || !cardRect.width) return 1;
    return Math.round(hostRect.width / cardRect.width) || 1;
  }

  function viewportPreloadDistance() {
    var d = Math.round(w.innerHeight * .25);
    if (d < 160) return 160;
    if (d > 360) return 360;
    return d;
  }

  function loadNextPage() {
    if (!state.hasMore || state.loading || state.active === '__home__') return false;
    loadCategory(state.active, state.page + 1, true);
    return true;
  }

  function maybeAutoLoadForFocus(target) {
    if (!target || !target.getAttribute || !w.EclipseAutoPagination) return false;
    var index = target.getAttribute('data-card-index');
    if (index === null) return false;
    if (!w.EclipseAutoPagination.shouldLoadForFocus({
      hasMore: state.hasMore,
      loading: state.loading,
      itemIndex: index,
      itemCount: state.items.length,
      preloadCount: gridPreloadCount()
    })) return false;
    return loadNextPage();
  }

  function maybeAutoLoadForViewport() {
    var pager = byId('autoPage');
    if (!pager || !w.EclipseAutoPagination) return false;
    var rect = pager.getBoundingClientRect();
    if (!w.EclipseAutoPagination.shouldLoadForViewport({
      hasMore: state.hasMore,
      loading: state.loading,
      sentinelTop: rect.top,
      viewportHeight: w.innerHeight,
      preloadDistance: viewportPreloadDistance()
    })) return false;
    return loadNextPage();
  }

  function scheduleAutoPageCheck() {
    w.clearTimeout(state.autoPageTimer);
    state.autoPageTimer = w.setTimeout(maybeAutoLoadForViewport, 90);
  }

  function handleFocusIn(event) {
    rememberFocus(event);
    maybeAutoLoadForFocus(event && event.target);
  }

  function updateHero(data) {
    var client = data && data.client ? data.client : {};
    setText('itemCount', state.homeItems.length || state.items.length);
    setText('classCount', state.classes.length);
    setText('clientMode', client.isLeanback ? 'TV' : 'PHONE');
    setText('sourceName', state.source.name || '未命名内容源');
  }

  function renderClasses() {
    var host = byId('classTabs');
    var entries = [{ typeId:'__home__', typeName:'推荐' }].concat(state.classes);
    clear(host);
    entries.forEach(function(entry, index) {
      var button = d.createElement('button');
      button.type = 'button';
      button.className = 'cat' + (entry.typeId === state.active ? ' active' : '');
      button.setAttribute('data-chip', entry.typeId);
      var icon = getChipIcon(entry.typeId);
      button.innerHTML = (icon || '') + '<span>' + (entry.typeName || entry.typeId || '分类') + '</span>';
      button.setAttribute('data-focus', focusId('tab', index));
      button.setAttribute('data-focus-row', 'classes');
      listen(button, 'click', function(){ selectClass(entry); });
      host.appendChild(button);
    });
  }

  function getChipIcon(id) {
    var icons = {
      '__home__':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
      'movie':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="17" y1="7" x2="22" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="2" y1="17" x2="7" y2="17"/></svg>',
      'series':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="13" rx="2" ry="2"/><polyline points="9 2 12 5 15 2"/><line x1="8" y1="2" x2="12" y2="5"/><line x1="16" y1="2" x2="12" y2="5"/></svg>',
      'variety':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5 L12 2 L22 8.5 L12 15 L2 8.5Z"/><path d="M2 8.5 L12 15 L22 8.5"/><path d="M12 15 L12 21"/><path d="M7 18 L12 21 L17 18"/></svg>',
      'anime':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
      'documentary':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>'
    };
    return icons[id] || icons['__home__'];
  }

  // ===== 切换分类时强制关闭筛选面板 =====
  function selectClass(entry) {
    if (!entry) return;
    closeFilterPanel();
    state.active = text(entry.typeId);
    state.activeName = entry.typeName || entry.typeId || '分类';
    state.extend = {};
    renderClasses();
    renderFilters();
    updateBannerVisibility();

    if (state.active === '__home__') {
      if (w.EclipseCategoryState) w.EclipseCategoryState.invalidate(state);
      state.items = state.homeItems.slice(0);
      state.page = 1;
      state.hasMore = false;
      state.truncated = !!(state.home && state.home.truncated);
      renderItems(false);
      status(state.truncated ? '结果过多，已显示前 500 条' : '已显示推荐内容', false);
      bannerState.initialized = false;
      if (state.homeItems.length) {
        initBanner();
      }
      return;
    }
    loadCategory(state.active, 1, false);
  }

  function applyHome(data) {
    var safe = data && typeof data === 'object' ? data : fallbackHome();
    if (w.EclipseCategoryState) w.EclipseCategoryState.invalidate(state);
    state.home = safe;
    state.source = safe.source || { key:'', name:'当前内容源' };
    state.classes = asArray(safe.classes);
    state.filters = safe.filters || {};
    state.homeItems = asArray(safe.items);
    state.items = state.homeItems.slice(0);
    state.active = '__home__';
    state.activeName = '推荐';
    state.extend = {};
    state.categorySnapshots = {};
    state.duplicateNotices = {};
    state.page = 1;
    state.pageCount = 1;
    state.hasMore = false;
    state.truncated = !!safe.truncated;
    renderClasses();
    renderFilters();
    renderItems(false);
    updateHero(safe);
    bannerState.initialized = false;
    updateBannerVisibility();
    if (state.active === '__home__' && state.homeItems.length) {
      initBanner();
    }
    status(state.truncated ? '结果过多，已显示前 500 条' : (state.native ? '已连接当前内容源' : '浏览器演示数据'), false);
    if (!state.items.length && state.classes.length) selectClass(state.classes[0]);
  }

  function loadCategory(typeId, page, append) {
    if (!w.EclipseCategoryState) return;
    var request = w.EclipseCategoryState.begin(state, typeId, page, append, state.extend);
    request.activeName = state.activeName;
    if (!request.append) clear(byId('contentGrid'));
    status('正在载入 ' + request.activeName, true);
    if (state.native && hasNative()) {
      w.fm.vodCategory(request.typeId, request.page, { filter:true, extend:request.extend }).then(function(data) {
        applyCategory(data, request);
        renderFilters();
      }).catch(function(error) {
        if (!w.EclipseCategoryState.fail(state, request)) return;
        status('分类载入失败', false);
        toast(error && error.message ? error.message : '内容源暂时不可用');
      });
    } else {
      w.setTimeout(function() {
        applyCategory(fallbackCategory(request.typeId, request.page, request.extend), request);
        renderFilters();
      }, 160);
    }
  }

  function fallbackCategory(typeId, page, extend) {
    var all = state.homeItems.length ? state.homeItems : generateAllItems();
    var typeMap = {
      'movie':'电影','series':'剧集','variety':'综艺',
      'anime':'动漫','documentary':'纪录片'
    };
    var targetType = typeMap[typeId] || typeId;
    var filtered = all.filter(function(item){ return item.typeName === targetType; });
    var pageSize = 12;
    var total = filtered.length;
    var pageCount = Math.ceil(total / pageSize);
    var pageNum = Math.max(1, Math.min(page, pageCount));
    var start = (pageNum - 1) * pageSize;
    var end = Math.min(total, start + pageSize);
    var pageItems = filtered.slice(start, end);
    return {
      version:1,
      source:state.source,
      client: state.home && state.home.client ? state.home.client : {},
      query:{ typeId:typeId, filter:true, extend:extend || {} },
      page:pageNum,
      pageCount:pageCount,
      hasMore: pageNum < pageCount,
      truncated:false,
      items:pageItems
    };
  }

  function applyCategory(data, request) {
    var pageItems = asArray(data && data.items);
    var queryTypeId = data && data.query ? text(data.query.typeId) : request.typeId;
    var duplicate = null;
    if (!w.EclipseCategoryState || !w.EclipseCategoryState.commit(state, request, data)) return false;
    if (!request.append && state.native && w.EclipseCategoryDiagnostics && !state.truncated) {
      duplicate = w.EclipseCategoryDiagnostics.record(state.categorySnapshots, queryTypeId, request.activeName, pageItems);
    }
    renderItems(request.append);
    if (state.truncated) {
      status('结果过多，已显示前 500 条', false);
      return true;
    }
    if (!duplicate) {
      status('已载入 ' + request.activeName, false);
      return true;
    }
    var message = '当前源返回的“' + request.activeName + '”与“' + duplicate.typeName + '”分类内容完全相同';
    status(message, false);
    var pairKey = [queryTypeId, duplicate.typeId].sort().join('\u001f');
    if (!state.duplicateNotices[pairKey]) {
      state.duplicateNotices[pairKey] = true;
      toast(message + '，已按真实接口结果展示');
    }
    return true;
  }

  // ===== openItem / openDetail =====
  function openItem(item) {
    if (!item) return;
    if (item.kind === 'action') { toast('此入口需要由内容源应用处理'); return; }
    if (item.kind === 'folder') {
      state.active = text(item.vodId);
      state.activeName = item.name || '分类';
      state.extend = {};
      renderClasses();
      renderFilters();
      loadCategory(state.active, 1, false);
      return;
    }
    if (state.native && w.fm) {
      if (typeof w.fm.openDetail === 'function') {
        status('正在打开 ' + (item.name || '内容'), true);
        w.fm.openDetail({
          siteKey: item.siteKey || state.source.key,
          vodId: item.vodId,
          title: item.name || '',
          pic: item.pic || '',
          content: item.content || '',
          remarks: item.remarks || ''
        }).then(function(){ status('正在进入详情页', false); }).catch(function(error){
          console.warn('原生 openDetail 失败，降级到浏览器弹窗', error);
          openDetail(item);
        });
        return;
      } else if (typeof w.fm.vod === 'function') {
        w.fm.vod(item.siteKey || state.source.key, item.vodId, item.name || '', item.pic || '', {
          content: item.content || '', remarks: item.remarks || ''
        }).catch(function(error){
          console.warn('原生 vod 失败，降级到浏览器弹窗', error);
          openDetail(item);
        });
        return;
      }
    }
    openDetail(item);
  }

  function openDetail(item) {
    state._detailItem = item;
    var poster = byId('detailPoster');
    var grad = poster.querySelector('.ph-grad');
    if (!grad) {
      poster.innerHTML = '<span class="ph-grad"></span><img class="ph-img" alt="" onerror="this.style.display=\'none\'">';
    }
    var newGrad = poster.querySelector('.ph-grad');
    var newImg = poster.querySelector('.ph-img');
    newGrad.textContent = item.name || '未命名';
    newGrad.className = 'ph-grad';
    var pic = resolvePic(item, 0);
    newImg.src = pic;
    newImg.onload = function(){ newGrad.classList.add('hide'); };
    newImg.onerror = function(){ newGrad.classList.remove('hide'); this.style.display='none'; };
    byId('detailTitle').textContent = item.name || '未命名';
    byId('detailMeta').textContent = [item.typeName || '', item.year || '', item.mediaType === 'movie' ? '电影' : '电视剧'].filter(Boolean).join(' · ');
    byId('detailBadge').textContent = item.remarks || '';
    byId('detailTags').innerHTML = '<span class="tag">' + (item.listTitle || '推荐') + '</span>' + (item.year ? '<span class="tag">'+text(item.year)+'</span>' : '') + '<span class="tag">TMDB</span>';
    byId('detailDesc').textContent = item.desc || item.overview || '暂无简介';
    syncFollowBtn();
    byId('sheetMask').classList.add('open');
    byId('detailSheet').classList.add('open');
    closeFilterPanel();
  }

  function closeDetail() {
    byId('sheetMask').classList.remove('open');
    byId('detailSheet').classList.remove('open');
    state._detailItem = null;
  }

  function loadFollows() {
    try { return JSON.parse(localStorage.getItem('eclipse_follows') || '[]'); } catch(e){ return []; }
  }
  function saveFollows(list) {
    try { localStorage.setItem('eclipse_follows', JSON.stringify(list)); } catch(e){}
  }
  function syncFollowBtn() {
    var item = state._detailItem;
    if (!item) return;
    var follows = loadFollows();
    var found = follows.some(function(f){ return f.id === item.id; });
    byId('followBtn').textContent = found ? '已追剧 ✓' : '追剧';
  }

  function submitSearch(event) {
    if (event) event.preventDefault();
    var keyword = text(byId('searchInput').value).replace(/^\s+|\s+$/g, '');
    if (!keyword) { toast('请输入搜索关键词'); return; }
    if (state.native && w.fm && typeof w.fm.search === 'function') {
      w.fm.search(keyword, {}).catch(function(error){ toast(error && error.message ? error.message : '无法打开搜索'); });
      return;
    }
    if (w.EclipseCategoryState) w.EclipseCategoryState.invalidate(state);
    state.active = '__home__';
    state.activeName = '搜索结果';
    state.items = state.homeItems.filter(function(item){ return text(item.name).toLowerCase().indexOf(keyword.toLowerCase()) >= 0; });
    state.hasMore = false;
    renderClasses();
    renderFilters();
    renderItems(false);
    status('浏览器演示搜索：' + keyword, false);
    closeFilterPanel();
  }

  function callApp(method, fallbackMessage) {
    if (state.native && w.fm && typeof w.fm[method] === 'function') {
      w.fm[method]().catch(function(error){ toast(error && error.message ? error.message : fallbackMessage); });
    } else toast(fallbackMessage);
  }

  function requestNativeHome() {
    if (!state.domReady || !hasNative() || state.nativeRequested) return;
    state.nativeRequested = true;
    state.native = true;
    w.__eclipseBoot.native = true;
    status('正在读取当前内容源', true);
    w.fm.vodHome({}).then(function(data) {
      applyHome(data);
    }).catch(function(error) {
      state.nativeRequested = false;
      state.native = false;
      applyHome(fallbackHome());
      toast(error && error.message ? error.message : '无法读取当前内容源，已显示演示数据');
    });
  }

  // ===== 焦点导航 =====
  function getFocusable() {
    var nodes = d.querySelectorAll('[data-focus]');
    var list = [];
    for (var i=0; i<nodes.length; i++) {
      var rect = nodes[i].getBoundingClientRect();
      if (rect.width > 0 && rect.height > 0 && !nodes[i].disabled) list.push(nodes[i]);
    }
    return list;
  }

  function rememberFocus(event) {
    var target = event.target;
    if (!target || !target.getAttribute) return;
    var key = target.getAttribute('data-focus');
    if (!key) return;
    state.focusKey = key;
    try { w.sessionStorage.setItem('eclipse.focus', key); } catch(ignore) {}
  }

  function restoreFocus() {
    w.setTimeout(function() {
      var key = state.focusKey;
      if (!key) {
        try { key = w.sessionStorage.getItem('eclipse.focus') || ''; } catch(ignore) {}
      }
      if (!key) return;
      var list = getFocusable();
      for (var i=0; i<list.length; i++) {
        if (list[i].getAttribute('data-focus') === key) {
          try { list[i].focus(); } catch(ignore2) {}
          return;
        }
      }
    }, 20);
  }

  function reveal(element) {
    var rect = element.getBoundingClientRect();
    var topGuard = 70, bottomGuard = w.innerHeight - 55;
    if (rect.top < topGuard) w.scrollTo(0, w.pageYOffset + rect.top - topGuard > 0 ? w.pageYOffset + rect.top - topGuard : 0);
    else if (rect.bottom > bottomGuard) w.scrollTo(0, w.pageYOffset + rect.bottom - bottomGuard);
  }

  function moveFocusInRow(list, current, direction) {
    var row = current && current.getAttribute ? current.getAttribute('data-focus-row') : '';
    var items = [];
    var currentIndex = -1;
    if ((direction !== 'left' && direction !== 'right') || !row || !w.EclipseFocusNavigation) return false;
    for (var i=0; i<list.length; i++) {
      var rect = list[i].getBoundingClientRect();
      items.push({ row: list[i].getAttribute('data-focus-row') || '', x: rect.left + rect.width/2 });
      if (list[i] === current) currentIndex = i;
    }
    var targetIndex = w.EclipseFocusNavigation.findHorizontalTarget(items, currentIndex, direction);
    if (targetIndex >= 0) {
      list[targetIndex].focus();
      reveal(list[targetIndex]);
    }
    return true;
  }

  function moveFocus(direction) {
    var list = getFocusable();
    var current = d.activeElement;
    if (!list.length) return;
    if (!current || list.indexOf(current) < 0) { list[0].focus(); reveal(list[0]); return; }
    if (moveFocusInRow(list, current, direction)) return;
    var currentRect = current.getBoundingClientRect();
    var cx = currentRect.left + currentRect.width/2;
    var cy = currentRect.top + currentRect.height/2;
    var best = null, bestScore = Number.MAX_VALUE;
    for (var i=0; i<list.length; i++) {
      var candidate = list[i];
      if (candidate === current) continue;
      var rect = candidate.getBoundingClientRect();
      var x = rect.left + rect.width/2;
      var y = rect.top + rect.height/2;
      if (direction === 'left' && x >= cx - 3) continue;
      if (direction === 'right' && x <= cx + 3) continue;
      if (direction === 'up' && y >= cy - 3) continue;
      if (direction === 'down' && y <= cy + 3) continue;
      var primary = direction === 'left' || direction === 'right' ? Math.abs(x - cx) : Math.abs(y - cy);
      var secondary = direction === 'left' || direction === 'right' ? Math.abs(y - cy) : Math.abs(x - cx);
      if (secondary > primary) continue;
      var score = primary * 10 + secondary * secondary / (primary > 1 ? primary : 1);
      if (score < bestScore) { bestScore = score; best = candidate; }
    }
    if (best) { best.focus(); reveal(best); }
  }

  function keydown(event) {
    var code = event.keyCode || event.which;
    var direction = code === 37 ? 'left' : code === 38 ? 'up' : code === 39 ? 'right' : code === 40 ? 'down' : '';
    var target = event.target;
    if (!direction) return;
    if (target && target.tagName === 'INPUT' && (direction === 'left' || direction === 'right')) return;
    event.preventDefault();
    moveFocus(direction);
  }

  // ===== 绑定 =====
  function bind() {
    if (state.domReady) return;
    state.domReady = true;
    w.__eclipseBoot.dom = true;

    initPalette();

    listen(byId('filterFab'), 'click', toggleFilterPanel);

    listen(byId('searchForm'), 'submit', submitSearch);
    listen(byId('sourceName'), 'click', function(){ callApp('openSite', '此操作需要在应用内使用'); });
    listen(byId('followListBtn'), 'click', function(){ callApp('openVod', '此操作需要在应用内使用'); });
    listen(byId('settingBtn'), 'click', function(){ callApp('openSetting', '此操作需要在应用内使用'); });

    byId('playBtn').addEventListener('click', function(){
      var item = state._detailItem;
      if (!item) return;
      if (state.native && w.fm && typeof w.fm.search === 'function') {
        w.fm.search(item.name || '');
        toast('已发起搜索：' + (item.name || ''));
      } else {
        toast('搜索播放：' + (item.name || ''));
      }
      closeDetail();
    });
    byId('followBtn').addEventListener('click', function(){
      var item = state._detailItem;
      if (!item) return;
      var follows = loadFollows();
      var idx = follows.findIndex(function(f){ return f.id === item.id; });
      if (idx >= 0) { follows.splice(idx,1); toast('已取消追剧'); }
      else { follows.push({ id:item.id, title:item.name, pic:item.pic, mediaType:item.mediaType }); toast('已加入追剧'); }
      saveFollows(follows);
      syncFollowBtn();
    });
    byId('sheetMask').addEventListener('click', closeDetail);
    byId('clearFollowBtn').addEventListener('click', function(){
      if (!loadFollows().length) { toast('追剧列表已经是空的'); return; }
      saveFollows([]);
      toast('已清空追剧列表');
    });

    listen(d, 'focusin', handleFocusIn);
    listen(d, 'keydown', keydown);
    listen(w, 'scroll', scheduleAutoPageCheck);
    listen(w, 'resize', scheduleAutoPageCheck);

    restoreCustomGradient();

    applyHome(fallbackHome());
    w.setTimeout(function(){
      if (hasNative()) requestNativeHome();
    }, 60);
    w.setTimeout(function(){
      if (!state.native && hasNative()) requestNativeHome();
    }, 700);
  }

  listen(w, 'fmsdk', function(){
    state.nativeRequested = false;
    requestNativeHome();
  });
  if (d.readyState === 'loading') listen(d, 'DOMContentLoaded', bind);
  else bind();

  w.__eclipseState = state;
  w.openDetail = openDetail;
  w.closeDetail = closeDetail;
  w.selectClass = selectClass;
  w.toggleFilterPanel = toggleFilterPanel;
  w.closeFilterPanel = closeFilterPanel;
}(window, document));
</script>
</body>
</html>
