<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Eclipse · 详情</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            min-height: 100%;
            margin: 0;
        }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.55;
            overflow-x: hidden;
            color: #f0f0f0;
            background: #000000;
        }
        button {
            color: inherit;
            font: inherit;
            cursor: pointer;
            border: none;
            background: none;
        }
        button:focus {
            outline: 2px solid #ffffff;
            outline-offset: 2px;
        }

        /* ===== 隐藏工具 ===== */
        .hidden {
            display: none !important;
        }

        /* ===== 背景层（全屏模糊封面） ===== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #000000;
        }
        .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(35px);
            transform: scale(1.08);
            opacity: 0.85;
        }
        .bg-layer .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        /* ===== 主容器 ===== */
        .shell {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: calc(20px + var(--fm-safe-top, 0px) + 30px) 16px calc(40px + var(--fm-safe-bottom, 0px)) 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部栏 ===== */
        .topbar {
            display: flex;
            align-items: center;
            padding: 10px 4px 20px;
            gap: 12px;
            flex-shrink: 0;
        }
        .back {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 24px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background .2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .back:active {
            background: rgba(255, 255, 255, 0.25);
        }
        .topbar .title-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .topbar .title-area .name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar .title-area .date {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
            margin-top: 2px;
        }
        .topbar .source-pill {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .topbar .source-pill:before {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 6px;
            border-radius: 50%;
            background: #6fcf97;
            content: "";
        }

        /* ===== 主卡片 ===== */
        .main-card {
            background: rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 24px 24px 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* ===== 加载/错误面板 ===== */
        .loading-panel,
        .error-panel {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
            color: #cccccc;
        }
        .loader {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .loading-panel h1,
        .error-panel h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }
        .loading-panel p,
        .error-panel p {
            font-size: 14px;
            color: #aaaaaa;
        }
        .error-icon {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 80, 60, 0.2);
            color: #ff6b5a;
            font-size: 28px;
            line-height: 54px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .error-actions .action {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            transition: background .2s;
        }
        .error-actions .action.primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .error-actions .action:active {
            transform: scale(.96);
        }

        /* ===== 内容区 ===== */
        #content.hidden {
            display: none !important;
        }

        /* ===== 详情头部 ===== */
        .detail-hero {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }
        .poster-wrap {
            flex: 0 0 130px;
            position: relative;
        }
        .poster {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .poster-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
        }

        .info-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .info-area .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 4px;
        }
        .info-area .badge-row .tag {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.20);
            color: #222222;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.10);
        }
        .info-area .badge-row .tag.rating {
            background: rgba(255, 255, 255, 0.30);
            color: #000000;
            border-color: rgba(255, 255, 255, 0.20);
        }
        .info-area .subtitle {
            font-size: 15px;
            color: #f0f0f0;
            margin-bottom: 4px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .info-area .subtitle strong {
            color: #ffffff;
            font-weight: 600;
        }
        .info-area .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .info-area .meta-row span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .info-area .desc {
            font-size: 15px;
            color: #f5f5f5;
            line-height: 1.8;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .info-area .desc.expanded {
            -webkit-line-clamp: unset;
        }
        .info-area .expand-btn {
            font-size: 14px;
            color: #ffffff;
            font-weight: 600;
            margin-top: 4px;
            align-self: flex-start;
            background: none;
            border: none;
            padding: 0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }
        .info-area .expand-btn:active {
            opacity: .6;
        }

        /* ===== 进度条 ===== */
        .progress-card {
            margin: 8px 0 14px;
            padding: 12px 18px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: background .2s;
        }
        .progress-card:active {
            background: rgba(0, 0, 0, 0.35);
        }
        .progress-card .icon {
            font-size: 20px;
            flex-shrink: 0;
            color: #ffffff;
        }
        .progress-card .info .label {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
        }
        .progress-card .info .name {
            font-size: 14px;
            color: #cccccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-card .progress-track {
            flex: 0 0 80px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .progress-card .progress-track .bar {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #ffffff, #cccccc);
            width: 0;
            transition: width .3s;
        }
        .progress-card .pct {
            font-size: 13px;
            color: #bbbbbb;
            flex-shrink: 0;
            min-width: 36px;
            text-align: right;
        }

        /* ===== 操作按钮行 ===== */
        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .action-row .action-btn {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.70);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #000000;
        }
        .action-row .action-btn:active {
            transform: scale(.94);
            background: rgba(255, 255, 255, 0.85);
        }
        .action-row .action-btn.primary {
            background: rgba(255, 255, 255, 0.70);
            color: #000000;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .action-row .action-btn.favorite[aria-pressed="true"] {
            background: rgba(255, 200, 180, 0.3);
            color: #ff6b5a;
            border-color: rgba(255, 200, 180, 0.2);
        }
        .action-row .action-btn svg {
            width: 16px;
            height: 16px;
        }

        /* ===== 线路选择 ===== */
        .line-section .label {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 6px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .line-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .line-tab {
            padding: 5px 14px;
            border-radius: 14px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all .2s;
            font-weight: 500;
            color: #e0e0e0;
        }
        .line-tab:active {
            transform: scale(.94);
        }
        .line-tab.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* ===== 选集区域 ===== */
        .episode-section .head .title {
            font-size: 16px;
            font-weight: 700;
            color: #f0f0f0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .episode-section .head .status {
            font-size: 13px;
            color: #cccccc;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .episode-ranges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .episode-range {
            padding: 4px 16px;
            border-radius: 14px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
            color: #d0d0d0;
            transition: all .2s;
        }
        .episode-range:active {
            transform: scale(.94);
        }
        .episode-range.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* ===== 选集网格 - 增大间距 ===== */
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 8px;
            max-width: 100%;
            overflow: hidden;
        }

        .episode-cell {
            padding: 14px 6px 12px;
            border-radius: 14px;
            background: rgba(0, 0, 0, 0.20);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            text-align: center;
            transition: all .2s ease;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            max-width: 100%;
            overflow: hidden;
        }
        .episode-cell:active {
            transform: scale(.94);
            background: rgba(0, 0, 0, 0.35);
        }
        .episode-cell.selected {
            background: rgba(255, 255, 255, 0.20);
            border-color: #ffffff;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .episode-cell .ep-number {
            font-size: 20px;
            font-weight: 700;
            color: #f0f0f0;
            line-height: 1.3;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .episode-cell .ep-name {
            font-size: 11px;
            color: #cccccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            width: 100%;
            margin-top: 3px;
            display: block;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* ===== 选集分页器 ===== */
        .episode-pager button {
            padding: 6px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 15px;
            transition: background .2s;
            min-width: 36px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
        }
        .episode-pager button:disabled {
            opacity: 0.25;
            pointer-events: none;
        }
        .episode-pager button:active {
            background: rgba(255, 255, 255, 0.20);
        }
        .episode-pager span {
            font-size: 14px;
            color: #cccccc;
            min-width: 52px;
            text-align: center;
        }

        /* ===== 底部模块 ===== */
        .extra-section .section-head h2 {
            font-size: 16px;
            font-weight: 700;
            color: #f0f0f0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .extra-section .section-head p {
            font-size: 13px;
            color: #bbbbbb;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        /* ===== 演员卡片 ===== */
        .people-grid,
        .gallery-strip,
        .recommendation-grid {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 6px 0 12px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .people-grid::-webkit-scrollbar,
        .gallery-strip::-webkit-scrollbar,
        .recommendation-grid::-webkit-scrollbar {
            height: 4px;
        }
        .people-grid::-webkit-scrollbar-thumb,
        .gallery-strip::-webkit-scrollbar-thumb,
        .recommendation-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .person-card {
            flex: 0 0 130px;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.30);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .person-card:active {
            transform: scale(0.96);
        }
        .person-card .person-photo {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }
        .person-card .person-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .person-card .person-photo .person-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            color: #aaaaaa;
            background: rgba(0, 0, 0, 0.3);
        }
        .person-card .person-copy {
            min-height: 64px;
            padding: 10px 8px;
        }
        .person-card .person-name {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .person-card .person-role {
            font-size: 12px;
            color: #bbbbbb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        /* ===== 剧照卡片 ===== */
        .gallery-item {
            flex: 0 0 210px;
            aspect-ratio: 16 / 9;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== 推荐卡片 ===== */
        .recommendation-card {
            flex: 0 0 150px;
            min-width: 0;
            padding: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.20);
            text-align: left;
            cursor: pointer;
        }
        .recommendation-card .recommendation-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }
        .recommendation-card .recommendation-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .recommendation-card .recommendation-poster .person-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 26px;
            font-weight: 700;
            color: #aaaaaa;
            background: rgba(0, 0, 0, 0.3);
        }
        .recommendation-card .recommendation-copy {
            padding: 10px 8px;
        }
        .recommendation-card .recommendation-name {
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        .recommendation-card .recommendation-subtitle {
            font-size: 12px;
            color: #bbbbbb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .recommendation-card .recommendation-rating {
            font-size: 12px;
            color: #ffffff;
            font-weight: 600;
        }

        .external-link {
            padding: 8px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            font-size: 14px;
            cursor: pointer;
            transition: background .2s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
        }
        .external-link:active {
            background: rgba(255, 255, 255, 0.20);
        }
        .external-link strong {
            font-weight: 600;
            color: #f0f0f0;
        }
        .external-link span {
            color: #aaaaaa;
            font-size: 13px;
            margin-left: 4px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            z-index: 30;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            max-width: 80%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== 空状态 ===== */
        .empty {
            padding: 24px;
            text-align: center;
            color: #aaaaaa;
            font-size: 15px;
            grid-column: 1 / -1;
        }

        /* ===== 推荐组 ===== */
        .recommendation-group-head h3 {
            font-size: 15px;
            font-weight: 700;
            color: #f0f0f0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .recommendation-group-head span {
            font-size: 12px;
            color: #bbbbbb;
        }
        .recommendation-reason {
            font-size: 13px;
            color: #ffffff;
            padding: 4px 0 6px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .shell {
                padding: calc(16px + var(--fm-safe-top, 0px) + 30px) 14px calc(30px + var(--fm-safe-bottom, 0px)) 14px;
            }
            .main-card {
                padding: 18px;
                border-radius: 18px;
            }
            .detail-hero {
                gap: 14px;
            }
            .poster-wrap {
                flex: 0 0 100px;
            }
            .topbar .title-area .name {
                font-size: 19px;
            }
            .topbar .title-area .date {
                font-size: 13px;
            }
            .info-area .subtitle {
                font-size: 14px;
            }
            .info-area .desc {
                font-size: 14px;
                -webkit-line-clamp: 2;
            }
            .episode-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .episode-cell {
                padding: 12px 4px 10px;
                min-height: 54px;
            }
            .episode-cell .ep-number {
                font-size: 17px;
            }
            .episode-cell .ep-name {
                font-size: 10px;
            }
            .action-row .action-btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            .line-tab {
                font-size: 12px;
                padding: 4px 12px;
            }
            .episode-range {
                font-size: 13px;
                padding: 4px 12px;
            }
            .person-card {
                flex: 0 0 110px;
            }
            .gallery-item {
                flex: 0 0 160px;
            }
            .recommendation-card {
                flex: 0 0 120px;
            }
            .topbar .source-pill {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .episode-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .episode-cell {
                padding: 10px 4px 8px;
                min-height: 48px;
            }
            .episode-cell .ep-number {
                font-size: 15px;
            }
            .episode-cell .ep-name {
                font-size: 9px;
            }
            .person-card {
                flex: 0 0 90px;
            }
            .gallery-item {
                flex: 0 0 130px;
            }
            .recommendation-card {
                flex: 0 0 100px;
            }
        }
        @media (max-width: 400px) {
            .poster-wrap {
                flex: 0 0 80px;
            }
            .detail-hero {
                gap: 10px;
            }
            .topbar .title-area .name {
                font-size: 17px;
            }
            .episode-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
            .episode-cell {
                padding: 8px 4px 6px;
                min-height: 42px;
            }
            .episode-cell .ep-number {
                font-size: 14px;
            }
            .episode-cell .ep-name {
                font-size: 8px;
            }
        }
        @media (min-width: 641px) and (max-width: 900px) {
            .episode-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- ===== 背景层 ===== -->
    <div class="bg-layer" id="bgLayer">
        <img id="bgImage" src="" alt="" crossorigin="anonymous">
        <div class="overlay"></div>
    </div>

    <div class="shell">
        <!-- ===== 顶部栏 ===== -->
        <header class="topbar">
            <button id="backButton" class="back" type="button" aria-label="返回">‹</button>
            <div class="title-area">
                <div class="name" id="topTitle">正在加载...</div>
                <div class="date" id="topDate"></div>
            </div>
            <div id="sourceName" class="source-pill">连接中</div>
        </header>

        <main>
            <!-- ===== 加载面板 ===== -->
            <section id="loadingPanel" class="main-card loading-panel" aria-live="polite">
                <div class="loader" aria-hidden="true"></div>
                <h1>正在展开光影档案</h1>
                <p>从当前内容源读取详情与选集</p>
            </section>

            <!-- ===== 错误面板 ===== -->
            <section id="errorPanel" class="main-card error-panel hidden" aria-live="assertive">
                <div class="error-icon" aria-hidden="true">!</div>
                <h1>详情暂时无法显示</h1>
                <p id="errorMessage">可以重试，或切换到原生详情页。</p>
                <div class="error-actions">
                    <button id="retryButton" class="action primary" type="button">重新加载</button>
                    <button id="errorNativeButton" class="action" type="button">使用原生详情</button>
                </div>
            </section>

            <!-- ===== 主内容 ===== -->
            <div id="content" class="hidden">
                <div class="main-card">
                    <!-- 详情头部 -->
                    <div class="detail-hero">
                        <div class="poster-wrap">
                            <div class="poster">
                                <span id="posterFallback" class="poster-fallback">影</span>
                                <img id="poster" class="hidden" alt="海报">
                            </div>
                        </div>
                        <div class="info-area">
                            <div class="badge-row">
                                <span class="tag" id="typeTag">剧集</span>
                                <span class="tag" id="statusTag">连载中</span>
                                <span class="tag rating" id="ratingTag">★ 0.0</span>
                            </div>
                            <div class="subtitle" id="subtitle">第 1 季 · 更新至 0 集</div>
                            <div class="meta-row">
                                <span id="metaYear">2026</span>
                                <span id="metaArea">中国</span>
                                <span id="metaGenre">剧情</span>
                            </div>
                            <p class="desc" id="summary">暂无简介</p>
                            <button class="expand-btn" id="expandBtn">展开</button>
                        </div>
                    </div>

                    <!-- 继续播放进度 -->
                    <div id="progressCard" class="progress-card hidden">
                        <span class="icon">▶</span>
                        <div class="info">
                            <div class="label">继续播放</div>
                            <div class="name" id="progressName">-</div>
                        </div>
                        <div class="progress-track"><div class="bar" id="progressValue"></div></div>
                        <span class="pct" id="progressText">0%</span>
                    </div>

                    <!-- 操作按钮 -->
                    <div class="action-row">
                        <button id="playButton" class="action-btn primary" type="button" data-focus-row="actions">▶ 播放</button>
                        <button id="favoriteButton" class="action-btn favorite" type="button" data-focus-row="actions" aria-pressed="false">♡ 收藏</button>
                        <button id="nativeButton" class="action-btn" type="button" data-focus-row="actions">原生详情</button>
                    </div>

                    <!-- 线路选择 -->
                    <div class="line-section">
                        <div class="label">线路</div>
                        <div id="lineTabs" class="line-tabs" role="tablist" aria-label="播放线路"></div>
                    </div>

                    <!-- 选集 -->
                    <div class="episode-section">
                        <div class="head">
                            <span class="title">选集</span>
                            <span class="status" id="episodeStatus">-</span>
                        </div>
                        <div id="episodeRanges" class="episode-ranges horizontal-rail hidden" role="tablist" aria-label="选集范围"></div>
                        <div id="episodes" class="episode-grid" role="tabpanel"></div>
                        <div id="pager" class="episode-pager hidden">
                            <button id="prevPage" type="button" data-focus-row="episode-pager" aria-label="上一组">‹</button>
                            <span id="pageText">1 / 1</span>
                            <button id="nextPage" type="button" data-focus-row="episode-pager" aria-label="下一组">›</button>
                        </div>
                    </div>

                    <!-- 演员 -->
                    <div id="peopleSection" class="extra-section hidden">
                        <div class="section-head">
                            <h2 id="peopleHeading">演员与主创</h2>
                            <p id="peopleStatus"></p>
                        </div>
                        <div id="people" class="people-grid horizontal-rail"></div>
                    </div>

                    <!-- 剧照 -->
                    <div id="gallerySection" class="extra-section hidden">
                        <div class="section-head">
                            <h2 id="galleryHeading">剧照</h2>
                            <p id="galleryStatus"></p>
                        </div>
                        <div id="gallery" class="gallery-strip horizontal-rail"></div>
                    </div>

                    <!-- 推荐 -->
                    <div id="recommendationSection" class="extra-section hidden">
                        <div class="section-head">
                            <h2 id="recommendationHeading">推荐</h2>
                            <p id="recommendationStatus"></p>
                        </div>
                        <div id="recommendationGroups"></div>
                    </div>

                    <!-- 外部链接 -->
                    <div id="externalSection" class="extra-section hidden">
                        <div class="section-head">
                            <h2 id="externalHeading">外部链接</h2>
                            <p id="externalStatus"></p>
                        </div>
                        <div id="externalLinks" class="external-links"></div>
                    </div>
                </div><!-- /.main-card -->
            </div><!-- /#content -->
        </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- ===== 外部模块 ===== -->
    <script src="eclipse-detail-state.js"></script>

    <!-- ===== 主脚本（保持不变） ===== -->
    <script>
        (function(w, d) {
            'use strict';
            var EPISODE_GROUP_SIZE = 20;
            var app = { booted: false, info: null, data: null, state: null, toastTimer: 0, fallbackTimer: 0, pending: false,
                refreshing: false, refreshQueued: false, expanded: false };

            function byId(id) { return d.getElementById(id); }

            function text(value) { return value === null || typeof value === 'undefined' ? '' : String(value); }

            function array(value) { return Object.prototype.toString.call(value) === '[object Array]' ? value : []; }

            function setText(id, value) { var node = byId(id); if (node) node.textContent = text(value); }

            function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); }

            function show(node, visible) { if (node) node.className = node.className.replace(/\s*hidden\b/g, '') + (visible ?
                    '' : ' hidden'); }

            function nativeApi() { return w.fm || w.fongmi || null; }

            // ===== 背景更新 =====
            function updateBackground(url) {
                var img = byId('bgImage');
                if (!img) return;
                var safe = w.EclipseDetailState.safeImageUrl(url);
                if (!safe) {
                    img.style.display = 'none';
                    img.removeAttribute('src');
                    return;
                }
                img.style.display = 'block';
                if (img.src === safe) return;
                img.src = safe;
                img.onerror = function() {
                    img.style.display = 'none';
                    img.removeAttribute('src');
                };
                img.onload = function() {
                    img.style.display = 'block';
                };
            }

            // ===== 顶部信息 =====
            function updateTopbar(item, media) {
                setText('topTitle', item.name || '未命名影片');
                setText('topDate', media.releaseDate || item.year || '');
                setText('sourceName', (app.data.source && app.data.source.name) || (app.info.source && app.info.source
                .name) || '当前内容源');
            }

            function toast(message) {
                var node = byId('toast');
                node.textContent = text(message);
                node.className = 'toast show';
                w.clearTimeout(app.toastTimer);
                app.toastTimer = w.setTimeout(function() { node.className = 'toast'; }, 2600);
            }

            function optional(id, value) {
                var node = byId(id);
                if (node) {
                    node.textContent = text(value);
                    show(node, !!text(value));
                }
            }

            // ===== 渲染英雄区 =====
            function renderHero() {
                var item = app.data.item || {};
                var media = app.data.media || {};
                var source = app.data.source || app.info.source || {};

                var bgUrl = media.backdrop || item.pic || item.poster || '';
                updateBackground(bgUrl);

                updateTopbar(item, media);

                var posterImg = byId('poster');
                var posterFallback = byId('posterFallback');
                var url = w.EclipseDetailState.safeImageUrl(item.pic || item.poster);
                posterImg.alt = text(item.name) + ' 海报';
                if (posterFallback) posterFallback.textContent = text(item.name).slice(0, 1) || '影';
                if (!url) {
                    show(posterImg, false);
                    if (posterFallback) show(posterFallback, true);
                } else {
                    posterImg.onload = function() { show(posterImg, true); if (posterFallback) show(posterFallback,
                        false); };
                    posterImg.onerror = function() { show(posterImg, false); if (posterFallback) show(posterFallback,
                        true); };
                    posterImg.src = url;
                }

                setText('typeTag', item.typeName || '剧集');
                setText('statusTag', statusLabel(media.status));
                var rating = Number(media.rating) || 0;
                setText('ratingTag', '★ ' + (rating > 0 ? rating.toFixed(1) : '0.0'));

                var subParts = [];
                if (Number(media.seasonCount) > 0) subParts.push('第 ' + Number(media.seasonCount) + ' 季');
                if (Number(media.episodeCount) > 0) subParts.push('更新至 ' + Number(media.episodeCount) + ' 集');
                setText('subtitle', subParts.length ? subParts.join(' · ') : '');

                setText('metaYear', item.year || '');
                setText('metaArea', item.area || '');
                setText('metaGenre', item.typeName || '');

                var summaryText = item.content || media.overview || '暂无简介';
                setText('summary', summaryText);
                app.expanded = false;
                byId('summary').classList.remove('expanded');
                byId('expandBtn').textContent = summaryText.length > 60 ? '展开' : '';

                var history = app.data.state && app.data.state.history;
                var duration = Number(history && history.durationMs) || 0;
                var position = Number(history && history.positionMs) || 0;
                var percent = duration > 0 ? Math.max(0, Math.min(100, Math.round(position * 100 / duration))) : 0;
                var progressCard = byId('progressCard');
                if (duration > 0 && position > 0) {
                    show(progressCard, true);
                    setText('progressText', percent + '%');
                    byId('progressValue').style.width = percent + '%';
                    var epName = app.state ? w.EclipseDetailState.selectedEpisode(app.state) : null;
                    setText('progressName', (epName && epName.name) || '继续观看');
                    var newCard = progressCard.cloneNode(true);
                    progressCard.parentNode.replaceChild(newCard, progressCard);
                    newCard.addEventListener('click', function() {
                        if (app.pending) return;
                        var ep = selectedEpisode();
                        if (ep) playEpisode(ep);
                        else playSelected();
                    });
                    byId('progressCard');
                } else {
                    show(progressCard, false);
                }

                renderFavorite();
            }

            function statusLabel(value) {
                var map = {
                    'Returning Series': '连载中',
                    'Ended': '已完结',
                    'Canceled': '已取消',
                    'In Production': '制作中',
                    'Released': '已上映',
                    'Post Production': '后期制作'
                };
                return map[text(value)] || text(value) || '未知';
            }

            function renderFavorite() {
                var button = byId('favoriteButton');
                var favorite = Boolean(app.state && app.state.favorite);
                button.setAttribute('aria-pressed', favorite ? 'true' : 'false');
                button.textContent = favorite ? '♥ 已收藏' : '♡ 收藏';
            }

            // ===== 展开/收起 =====
            function toggleExpand() {
                var el = byId('summary');
                if (!el) return;
                app.expanded = !app.expanded;
                el.classList.toggle('expanded', app.expanded);
                byId('expandBtn').textContent = app.expanded ? '收起' : '展开';
            }

            // ===== 卡片图片工具 =====
            function cardImage(url, alt, className, fallback) {
                var safe = w.EclipseDetailState.safeImageUrl(url);
                if (!safe) return null;
                var image = d.createElement('img');
                image.className = className || '';
                image.alt = text(alt);
                image.onload = function() {
                    if (fallback) show(fallback, false);
                };
                image.onerror = function() { image.remove(); };
                image.src = safe;
                return image;
            }

            function actionFailure(result, fallback) {
                if (!result || typeof result.catch !== 'function') return;
                result.catch(function(error) { toast(error && error.message ? error.message : fallback); });
            }

            // ===== 长按 =====
            function bindLongPress(node, handler) {
                var timer = 0,
                    fired = false,
                    resetTimer = 0;

                function clearTimer() {
                    if (!timer) return;
                    w.clearTimeout(timer);
                    timer = 0;
                }

                function markFired(event) {
                    if (event && typeof event.preventDefault === 'function') event.preventDefault();
                    if (fired) return;
                    clearTimer();
                    fired = true;
                    w.clearTimeout(resetTimer);
                    resetTimer = w.setTimeout(function() { fired = false; }, 1200);
                    handler();
                }

                function schedule(event) {
                    if (timer || fired) return;
                    timer = w.setTimeout(function() { timer = 0;
                        markFired(event); }, 650);
                }
                node.addEventListener('pointerdown', function(event) {
                    if (typeof event.button === 'number' && event.button !== 0) return;
                    schedule(event);
                });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(name) {
                    node.addEventListener(name, clearTimer);
                });
                node.addEventListener('contextmenu', markFired);
                node.addEventListener('keydown', function(event) {
                    if (event.key === 'ContextMenu' || event.key === 'F2') { markFired(event); return; }
                    if (event.key !== 'Enter' && event.key !== ' ' && event.key !== 'Select') return;
                    if (event.repeat) markFired(event);
                    else schedule(event);
                });
                node.addEventListener('keyup', function(event) {
                    if (event.key === 'Enter' || event.key === ' ' || event.key === 'Select') clearTimer();
                });
                node.addEventListener('click', function(event) {
                    if (!fired) return;
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    fired = false;
                    w.clearTimeout(resetTimer);
                }, true);
            }

            // ===== 人物 =====
            function openPerson(person) {
                var api = nativeApi();
                if (!api || !api.person || typeof api.person.open !== 'function' || !text(person && person.personRef))
                return;
                actionFailure(api.person.open(person.personRef), '无法打开人物详情');
            }

            function renderPeople() {
                var root = byId('people');
                var values = array(app.data.people);
                var capabilities = app.data.capabilities || {};
                var api = nativeApi();
                var canOpen = Boolean(capabilities.canOpenPeople && api && api.person && typeof api.person.open ===
                'function');
                var castCount = 0,
                    crewCount = 0;
                clear(root);
                values.forEach(function(person) {
                    var interactive = Boolean(canOpen && text(person.personRef));
                    var card = d.createElement(interactive ? 'button' : 'div');
                    var photo = d.createElement('div');
                    var fallback = d.createElement('div');
                    var copy = d.createElement('div');
                    var name = d.createElement('div');
                    var role = d.createElement('div');
                    var image;
                    card.className = 'person-card';
                    if (interactive) {
                        card.type = 'button';
                        card.setAttribute('data-focus-row', 'people');
                        card.addEventListener('click', function() { openPerson(person); });
                    }
                    card.setAttribute('data-person-id', text(person.personRef || (person.kind + '-' + (person
                    .personId || person.name))));
                    photo.className = 'person-photo';
                    fallback.className = 'person-fallback';
                    fallback.textContent = text(person.name).slice(0, 1) || '影';
                    photo.appendChild(fallback);
                    image = cardImage(person.profile, text(person.name) + ' 人物照片', '', fallback);
                    if (image) photo.appendChild(image);
                    copy.className = 'person-copy';
                    name.className = 'person-name';
                    name.textContent = person.name || '未命名';
                    role.className = 'person-role';
                    role.textContent = person.role || person.department || (person.kind === 'crew' ? '主创' : '演员');
                    copy.appendChild(name);
                    copy.appendChild(role);
                    card.appendChild(photo);
                    card.appendChild(copy);
                    root.appendChild(card);
                    if (person.kind === 'crew') crewCount += 1;
                    else castCount += 1;
                });
                setText('peopleStatus', (castCount ? castCount + ' 位演员' : '') + (castCount && crewCount ? ' · ' : '') + ( 
                    crewCount ? crewCount + ' 位主创' : ''));
                show(byId('peopleSection'), values.length > 0);
            }

            // ===== 剧照 =====
            function previewImage(item) {
                var api = nativeApi();
                if (!api || !api.image || typeof api.image.preview !== 'function' || !text(item && item.imageRef)) return;
                actionFailure(api.image.preview(item.imageRef), '无法预览原图');
            }

            function saveImage(item) {
                var api = nativeApi();
                if (!api || !api.image || typeof api.image.save !== 'function' || !text(item && item.imageRef)) return;
                actionFailure(api.image.save(item.imageRef), '无法保存原图');
            }

            function renderGallery() {
                var root = byId('gallery');
                var item = app.data.item || {};
                var capabilities = app.data.capabilities || {};
                var api = nativeApi();
                var values = array(app.data.galleryItems).map(function(value) {
                    return { imageRef: text(value && value.imageRef), preview: w.EclipseDetailState
                            .safeImageUrl(value && value.preview) };
                }).filter(function(value) { return !!value.preview; });
                var canPreview = Boolean(capabilities.canPreviewImages && api && api.image && typeof api.image
                    .preview === 'function');
                var canSave = Boolean(capabilities.canSaveImages && api && api.image && typeof api.image.save ===
                    'function');
                if (!values.length) {
                    values = array(app.data.gallery).map(function(value) {
                        return { imageRef: '', preview: w.EclipseDetailState.safeImageUrl(value) };
                    }).filter(function(value) { return !!value.preview; });
                }
                clear(root);
                values.forEach(function(value, index) {
                    var interactive = Boolean((canPreview || canSave) && value.imageRef);
                    var frame = d.createElement(interactive ? 'button' : 'div');
                    var image = cardImage(value.preview, (item.name || '影片') + ' 剧照 ' + (index + 1), '');
                    frame.className = 'gallery-item';
                    if (interactive) {
                        frame.type = 'button';
                        frame.setAttribute('data-focus-row', 'gallery');
                        frame.addEventListener('click', function() {
                            if (canPreview) previewImage(value);
                            else saveImage(value);
                        });
                    }
                    frame.setAttribute('data-gallery-id', text(value.imageRef || index));
                    if (canSave && value.imageRef) {
                        frame.addEventListener('contextmenu', function(event) { event.preventDefault();
                            saveImage(value); });
                        frame.addEventListener('keydown', function(event) {
                            if (event.key === 'ContextMenu' || event.key === 's' || event.key === 'S') {
                                event.preventDefault();
                                saveImage(value);
                            }
                        });
                    }
                    if (image) frame.appendChild(image);
                    root.appendChild(frame);
                });
                setText('galleryStatus', values.length + ' 张' + (canPreview ? ' · 点击查看原图' : (canSave ?
                    ' · 点击保存原图' : '')));

            // ===== 焦点 =====
            function ensureRailItemVisible(node) {
                var rail = node && node.parentElement;
                var railRect, itemRect, padding = 10,
                    delta = 0;
                if (!rail || !rail.classList || !rail.classList.contains('horizontal-rail')) return;
                railRect = rail.getBoundingClientRect();
                itemRect = node.getBoundingClientRect();
                if (itemRect.left < railRect.left + padding) delta = itemRect.left - railRect.left - padding;
                else if (itemRect.right > railRect.right - padding) delta = itemRect.right - railRect.right + padding;
                if (Math.abs(delta) > 0.5) rail.scrollLeft += delta;
            }

            function ensureFocusVisible(node) {
                if (!node || node === d.body) return;
                try { node.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (ignore) { node.scrollIntoView(
                        false); }
                w.requestAnimationFrame(function() { ensureRailItemVisible(node); });
            }

            function focusByData(attribute, value) {
                var nodes = d.querySelectorAll('[' + attribute + ']');
                for (var index = 0; index < nodes.length; index += 1) {
                    if (nodes[index].getAttribute(attribute) === text(value)) {
                        nodes[index].focus();
                        ensureFocusVisible(nodes[index]);
                        return true;
                    }
                }
                return false;
            }

            function focusByRow(row, rowIndex) {
                var nodes = d.querySelectorAll('[data-focus-row]');
                var matches = [];
                for (var index = 0; index < nodes.length; index += 1) {
                    var node = nodes[index];
                    if (node.getAttribute('data-focus-row') !== text(row) || node.disabled) continue;
                    if (node.getBoundingClientRect().width > 0 && node.getBoundingClientRect().height > 0) matches.push(
                    node);
                }
                if (!matches.length) return false;
                var node = matches[Math.min(Math.max(0, Number(rowIndex) || 0), matches.length - 1)];
                node.focus();
                ensureFocusVisible(node);
                return true;
            }

            function focusMarker() {
                var node = d.activeElement;
                var attributes = ['data-source-id', 'data-episode-id', 'data-episode-page', 'data-person-id',
                    'data-gallery-id', 'data-recommendation-id', 'data-external-id'
                ];
                var marker = {};
                if (!node || node === d.body) return null;
                if (node.id) marker.id = node.id;
                for (var index = 0; index < attributes.length; index += 1) {
                    if (node.hasAttribute && node.hasAttribute(attributes[index])) {
                        marker.attribute = attributes[index];
                        marker.value = node.getAttribute(attributes[index]);
                        break;
                    }
                }
                var row = node.getAttribute && node.getAttribute('data-focus-row');
                if (row) {
                    var rowNodes = d.querySelectorAll('[data-focus-row]');
                    var rowIndex = 0;
                    for (var i = 0; i < rowNodes.length; i += 1) {
                        if (rowNodes[i].getAttribute('data-focus-row') !== row) continue;
                        if (rowNodes[i] === node) break;
                        rowIndex += 1;
                    }
                    marker.row = row;
                    marker.rowIndex = rowIndex;
                }
                return marker.id || marker.attribute || marker.row ? marker : null;
            }

            function restoreFocus(marker) {
                if (!marker) return false;
                if (marker.id && byId(marker.id) && !byId(marker.id).disabled) {
                    byId(marker.id).focus();
                    return true;
                }
                if (marker.attribute && focusByData(marker.attribute, marker.value)) return true;
                return marker.row ? focusByRow(marker.row, marker.rowIndex) : false;
            }

                    w.setTimeout(function() { if (!restoreFocus(marker)) byId('playButton').focus(); }, 20);
                } else if (app.info && app.info.client && app.info.client.isLeanback) {
                    w.setTimeout(function() { byId('playButton').focus(); }, 30);

                clearNativeFallback();

                    app.info = info || {};
                    return api.vodDetail({ vodId: info && info.route ? info.route.vodId : '' });
                }).then(function(data) {
                    app.data = data || {};
                    render(false, null);
                    if (app.refreshQueued) {
                        app.refreshQueued = false;
                        refreshDetail();

                    showError(error);

            function refreshDetail() {
                var api = nativeApi();
                var item = app.data && app.data.item;
                if (!api || typeof api.vodDetail !== 'function') return;
                if (!item) { app.refreshQueued = true; return; }
                if (app.refreshing) { app.refreshQueued = true; return; }
                app.refreshing = true;
                api.vodDetail({ vodId: item.vodId || '', cached: true }).then(function(data) {
                    var marker = focusMarker();
                    app.data = data || app.data;
                    render(true, marker);
                }).catch(function() {}).then(function() {
                    app.refreshing = false;
                    if (app.refreshQueued) {
                        app.refreshQueued = false;
                        refreshDetail();
                    }
                });
            }

            // ===== 焦点导航 =====
            function focusables() {
                return Array.prototype.slice.call(d.querySelectorAll('button:not([disabled]),[tabindex="0"]')).filter(
                function(node) {
                    var rect = node.getBoundingClientRect();
                    return rect.width > 0 && rect.height > 0;
                });
            }

            function moveFocus(direction) {
                var nodes = focusables();
                var current = d.activeElement;
                var index = nodes.indexOf(current);
                if (index < 0) { if (nodes.length) nodes[0].focus(); return; }
                var geometry = nodes.map(function(node) {
                    var rect = node.getBoundingClientRect();
                    return { left: rect.left, top: rect.top, width: rect.width, height: rect.height, row: node
                            .getAttribute('data-focus-row') || '' };
                });
                var targetIndex = w.EclipseDetailState.nextFocusIndex(geometry, index, direction);
                var best = targetIndex >= 0 ? nodes[targetIndex] : null;
                if (best) { best.focus();
                    ensureFocusVisible(best); }
            }

            // ===== 展开按钮 =====
            byId('expandBtn').addEventListener('click', toggleExpand);

            // ===== 绑定 =====
            function bind() {
                byId('backButton').addEventListener('click', goBack);
                byId('retryButton').addEventListener('click', loadDetail);
                byId('errorNativeButton').addEventListener('click', openNative);
                byId('nativeButton').addEventListener('click', openNative);
                byId('playButton').addEventListener('click', playSelected);
                byId('favoriteButton').addEventListener('click', toggleFavorite);
                byId('prevPage').addEventListener('click', function() { app.state.page -= 1;
                    renderEpisodes(); });
                byId('nextPage').addEventListener('click', function() { app.state.page += 1;
                    renderEpisodes(); });
                d.addEventListener('focusin', function(event) { ensureFocusVisible(event.target); });
                d.addEventListener('keydown', function(event) {
                    var direction = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' } [
                    event.key];
                    if (direction) { event.preventDefault();
                        moveFocus(direction); } else if (event.key === 'Escape' || event.key === 'BrowserBack') { event
                            .preventDefault();
                        goBack(); }
                });
                w.addEventListener('fmresume', function() {
                    app.paused = false;
                    if (!app.data || !app.data.item) { loadDetail(); return; }
                    refreshDetail();
                    w.setTimeout(function() {
                        if (d.activeElement && d.activeElement !== d.body) return;
                        if (!focusByData('data-episode-id', app.state && app.state.episodeId)) byId(
                            'playButton').focus();
                    }, 40);
                });
                w.addEventListener('fmpause', function() {
                    app.paused = true;
                    clearNativeFallback();
                });
                w.addEventListener('fmviewport', function() { ensureFocusVisible(d.activeElement); });
                w.addEventListener('fmdetailchange', refreshDetail);
            }

            function boot() {
                if (app.booted) { loadDetail(); return; }
                app.booted = true;
                bind();
                loadDetail();
            }

            w.addEventListener('fmsdk', boot);
            if (d.readyState === 'loading') {
                d.addEventListener('DOMContentLoaded', function() { if (nativeApi()) boot(); });
            } else if (nativeApi()) {
                boot();
            }
            w.setTimeout(function() { if (!app.booted && nativeApi()) boot(); }, 350);
            w.onerror = function(message) {
                showError(new Error(text(message) || '详情页脚本异常'));
                scheduleNativeFallback();
            };

            w.__detailApp = app;
        }(window, document));
    </script>
</body>
</html>
